fanout:
  version: 3
  type: "flow"
  name: "Parallel FanOut"
  description: "Delegate a specific coding task to parallel sub-agents."
  retry_prompt: |
    Your previous attempt failed verification. Analyze the following trace and fix the specific errors. Do not rewrite the entire solution if only a localized fix is needed.

    Trace:
    {{.ErrorTrace}}

  review_prompt: |
    The automated sub-agents have completed their proposals. Please evaluate the following candidate diffs. Write a comparative summary and recommend the best approach to the human user.

    ### Candidate Branches

    {{ range .Branches }}
    * [`{{ .CandidateID }}`](#branch:{{ .CandidateID }})

    #### {{ .CandidateID }}
    {{ if not .Passed }}⚠️ **VERIFICATION FAILED**:
    <trace>
    {{ .Trace }}
    </trace>
    {{ end }}
    <diff>
    {{ .Diff }}
    </diff>
    {{ end }}

  refine_prompt: |
    The automated sub-agents have completed their proposals. Please evaluate the following candidate proposals. Write a detailed comparative summary. Based on your evaluation, your comparative analysis will be provided as background architectural guidance for a single, final sub-agent to synthesize the ultimate best version.

    ### Candidate Branches

    {{ range .Branches }}
    * [`{{ .CandidateID }}`](#branch:{{ .CandidateID }})

    #### {{ .CandidateID }}
    {{ if not .Passed }}⚠️ **VERIFICATION FAILED**:
    <trace>
    {{ .Trace }}
    </trace>
    {{ end }}
    {{ .Projection }}
    {{ end }}

  synthesize_prompt: |
    Find the best architectural patterns and implementations across the candidate branches in your background context and merge them into a single, unified solution.
    In your JSON `"thought"` field (or introductory prose before patch blocks), explicitly explain which patterns or components you adopted from each candidate branch and why.

  synthesis_review_prompt: |
    The synthesis sub-agent has completed its unified proposal (`{{ .CandidateID }}`). Write a clear summary of the synthesized changes, the merge rationale, and verification status for the human user to review and approve.
    {{ if .Reasoning }}
    ### Synthesis Agent Merge Rationale
    {{ .Reasoning }}
    {{ end }}
    {{ if not .Passed }}
    ⚠️ **VERIFICATION FAILED**:
    <trace>
    {{ .Trace }}
    </trace>
    {{ end }}
    <diff>
    {{ .Diff }}
    </diff>