digest:
  type: "core"
  name: "Digest Manager"
  manual_prompt: |
    [TASK]: You are performing a manual context digest. Summarize the provided context explicitly, retaining critical technical constraints.
    
    Topic: {{.TopicName}}
    Instruction: {{.Instruction}}
    
    Context:
    {{.Context}}

  background_prompt: |
    [TASK]: You are an automated background process compressing old chat history.
    Summarize the "Target Window" of historical context. Focus on extracting architectural decisions, facts, and current state. Ignore pleasantries. 
    You may generate 0, 1, or multiple distinct digests depending on the varied topics discussed.
    
    Use the "Active Buffer" (which represents the most recent, ongoing conversation) for context so you do not redundantly summarize things that are still actively being discussed.

    Target Window (To Summarize):
    {{.TargetWindow}}

    Active Buffer (For Context Only):
    {{.ActiveBuffer}}