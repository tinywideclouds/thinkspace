<div class="chat-layout">
  
  <main class="chat-main">
    <div class="chat-header">
      <llm-chat-header
        style="flex: 1; margin-right: 24px;"
        [spaces]="workspaceState.spaces()"
        [activeSpaceId]="workspaceState.activeSpaceId()"
        [chats]="workspaceState.chats()"
        [activeChatId]="workspaceState.activeChatId()"
        (spaceSelected)="onSpaceSelected($event)"
        (chatSelected)="onChatSelected($event)"
        (newChatRequested)="onNewChatRequested()">
      </llm-chat-header>
      
      <div class="connection-status" [class.connected]="chatState.connected()">
        {{ chatState.connected() ? '🟢 Connected' : '🔴 Disconnected' }}
      </div>
      
      <!-- Developer Toggle for Auto-Approve -->
      <label style="margin-left: 16px; font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer;">
        <input 
          type="checkbox" 
          [checked]="chatState.autoApproveContext()" 
          (change)="chatState.autoApproveContext.set(!chatState.autoApproveContext())" 
        />
        Auto-Approve Context
      </label>
    </div>
    
    <div class="chat-scroll-area">
      <llm-chat-feed 
        [feed]="chatState.coreChat()" 
        [flowStates]="chatState.flowStates()"
        (inspectFlow)="chatState.inspectFlow($event)">
      </llm-chat-feed>

      <div class="prompt-area">
        @if (chatState.pendingContextReview(); as contextReview) {
          <llm-context-inspector
            [context]="contextReview"
            (approve)="chatState.submitContextApproval(true)"
            (reviewCancelled)="chatState.submitContextApproval(false)"
            (copyFull)="chatState.copyFullContextPreview($event)">
          </llm-context-inspector>
        } @else if (chatState.pendingStrategy()) {
          <llm-chat-strategy-prompt 
            (strategySelected)="chatState.selectStrategy($event)">
          </llm-chat-strategy-prompt>
        } @else if (chatState.pendingReviewBranch(); as branch) {
          <llm-chat-review-prompt 
            [branch]="branch" 
            (reviewDecided)="chatState.submitReview($event)">
          </llm-chat-review-prompt>
        } @else {
          <llm-chat-input 
            (sendPrompt)="chatState.submitPrompt($event)">
          </llm-chat-input>
        }
      </div>
    </div>
  </main>

  <aside class="chat-drawer">
    <llm-flow-tracker 
      [systemLogs]="chatState.systemLogs()"
      [flows]="chatState.flowStates()"
      [retainLogs]="chatState.retainLogs()"
      (toggleRetainLogs)="chatState.retainLogs.set(!chatState.retainLogs())"
      (manualClearLogs)="chatState.manualClearLogs()">
    </llm-flow-tracker>
  </aside>

  @if (chatState.inspectedReceipt()) {
    <llm-flow-inspector 
      [receiptXml]="chatState.inspectedReceipt()!"
      (close)="chatState.inspectedReceipt.set(null)">
    </llm-flow-inspector>
  }
</div>
