<div class="flex flex-col h-full w-full bg-white overflow-hidden font-sans relative">
  
  <!-- Top Full-Width Header Area -->
  <header class="flex flex-col z-20 bg-white shadow-sm shrink-0">
    <div class="p-4 flex justify-between items-center border-b border-gray-100">
      <llm-chat-header
        class="flex-1 mr-6"
        [spaces]="workspaceState.spaces()"
        [activeSpaceId]="workspaceState.activeSpaceId()"
        [chats]="workspaceState.chats()"
        [activeChatId]="workspaceState.activeChatId()"
        (spaceSelected)="onSpaceSelected($event)"
        (chatSelected)="onChatSelected($event)"
        (newChatRequested)="onNewChatRequested()">
      </llm-chat-header>
      
      <div class="flex items-center gap-6">
        
        <!-- Tag Filter Mode Toggle -->
        <div class="flex items-center gap-2 border-r border-gray-200 pr-6">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tag Mode</span>
          <div class="flex bg-gray-100 p-0.5 rounded shadow-inner">
            <button 
              (click)="timelineFacade.uiSettings.tagFilterMode.set('visual')"
              class="px-3 py-1 text-[10px] font-bold uppercase rounded transition-all"
              [ngClass]="timelineFacade.uiSettings.tagFilterMode() === 'visual' ? 'bg-white text-gray-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
              Visual
            </button>
            <button 
              (click)="timelineFacade.uiSettings.tagFilterMode.set('context')"
              class="px-3 py-1 text-[10px] font-bold uppercase rounded transition-all"
              [ngClass]="timelineFacade.uiSettings.tagFilterMode() === 'context' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'"
              title="Dispatch tag selections to the backend Context Engine">
              Context
            </button>
          </div>
        </div>

        <!-- Timeline View Toggles -->
        <div class="flex items-center gap-2 border-r border-gray-200 pr-6">
          <div class="flex bg-gray-100 p-1 rounded-lg">
            <button 
              (click)="timelineFacade.viewMode.set('linear')"
              class="px-4 py-1 text-[10px] font-bold uppercase tracking-wider rounded transition-all duration-200"
              [ngClass]="timelineFacade.viewMode() === 'linear' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
              Linear
            </button>
            <button 
              (click)="timelineFacade.viewMode.set('cognitive')"
              class="px-4 py-1 text-[10px] font-bold uppercase tracking-wider rounded transition-all duration-200"
              [ngClass]="timelineFacade.viewMode() === 'cognitive' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
              Graph
            </button>
          </div>
        </div>

        <!-- Global Edit Toggle -->
        <button 
          (click)="timelineFacade.toggleEditMode()"
          class="flex items-center gap-2 px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider rounded-lg border transition-colors shadow-sm"
          [ngClass]="timelineFacade.isEditMode() ? 'bg-blue-600 text-white border-blue-700 hover:bg-blue-700' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'">
          <span>{{ timelineFacade.isEditMode() ? 'Exit Edit' : 'Edit Timeline' }}</span>
          <span class="text-[14px] leading-none">{{ timelineFacade.isEditMode() ? '×' : '✏️' }}</span>
        </button>

        <div class="text-[11px] font-bold uppercase tracking-wider" [class.text-green-600]="connection.connected()" [class.text-red-500]="!connection.connected()">
          {{ connection.connected() ? '🟢' : '🔴' }}
        </div>
      </div>
    </div>

    <!-- Pure Visualization HUD -->
    <llm-focus-hud
      [focus]="timelineFacade.activeFocus()"
      [activeHoverTag]="timelineFacade.hoveredTag()"
      (tagHovered)="timelineFacade.setHoveredTag($event)"
      (tagClicked)="timelineFacade.toggleTagFilter($event)">
    </llm-focus-hud>
  </header>

  <!-- Bottom Split Content Area -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Left/Main Column: Chat & Topology -->
    <main class="flex-1 flex flex-col min-w-0 border-r border-gray-200 relative">
      
      <!-- Dynamic Workspace Area (Feed/Graph) -->
      <div class="flex-1 overflow-hidden bg-gray-50 relative">
        @if (timelineFacade.viewMode() === 'linear') {
          <div class="max-w-4xl mx-auto w-full h-full">
            <llm-linear-feed class="block h-full w-full"></llm-linear-feed>
          </div>
        } @else {
          <div class="w-full h-full">
            <llm-cognitive-graph></llm-cognitive-graph>
          </div>
        }
      </div>

      <!-- Input Footer -->
      <div class="p-4 bg-white border-t border-gray-200 shrink-0 z-20">
        <div class="max-w-4xl mx-auto w-full">
          <!-- The timeline linear-feed now has exclusive control over all interactive UI prompts -->
          <llm-chat-input 
            (sendPrompt)="connection.submitPrompt($event)">
          </llm-chat-input>
        </div>
      </div>
    </main>

    <!-- Right Column: Workbench & Flow Tracker -->
    <aside class="w-80 flex flex-col shrink-0 bg-white z-30 relative shadow-[-4px_0_15px_rgba(0,0,0,0.03)]">
      <div class="h-1/2 min-h-[300px] border-b border-gray-200">
        <llm-desk [items]="cognitive.activeWorkbench()"></llm-desk>
      </div>

      <div class="flex-1 overflow-hidden bg-gray-50">
        <llm-flow-tracker 
          [systemLogs]="flow.systemLogs()"
          [flows]="flow.flowStates()"
          [retainLogs]="flow.retainLogs()"
          (toggleRetainLogs)="flow.retainLogs.set(!flow.retainLogs())"
          (manualClearLogs)="flow.manualClearLogs()">
        </llm-flow-tracker>
      </div>
    </aside>

  </div>

  <!-- Modals -->
  @if (flow.inspectedFlow(); as flowItem) {
    <llm-flow-inspector 
      [flowItem]="flowItem"
      (inspectorClosed)="flow.inspectedFlow.set(null)">
    </llm-flow-inspector>
  }
  
  <!-- Flow Graph Canvas Overlay Layer -->
  @if (flow.inspectedGraphId(); as graphId) {
    <div class="fixed inset-0 z-50 bg-white flex flex-col shadow-2xl transition-opacity">
      <!-- Overlay Header -->
      <header class="h-14 border-b border-gray-200 flex items-center px-4 bg-gray-50 shrink-0 justify-between shadow-sm z-20">
        <div class="flex items-center gap-4">
          <button 
            (click)="flow.inspectedGraphId.set(null)"
            class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors bg-white border border-gray-200 rounded-md px-3 py-1.5 shadow-sm hover:bg-gray-100"
            title="Back to Chat">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Back to Chat
          </button>
          
          <div class="flex flex-col border-l border-gray-300 pl-4">
            <span class="text-sm font-bold text-gray-800 tracking-tight">DAG Inspection</span>
            <span class="text-xs text-gray-500 font-mono">{{ graphId }}</span>
          </div>
        </div>
      </header>

      <!-- The Graph Viewport -->
      <div class="flex-grow overflow-hidden relative bg-gray-100 bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px]">
        <llm-flow-graph [flowId]="graphId"></llm-flow-graph>
      </div>
    </div>
  }
</div>
