<llm-graph-canvas class="w-full h-full block bg-gray-50">
  
  <!-- SVG Edges Layer (Background) -->
  <svg class="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none z-0">
    @for (edge of layout().edges; track edge.id) {
      <path 
        [attr.d]="edge.pathData" 
        fill="none" 
        stroke="#cbd5e1" 
        stroke-width="2" />
    }
  </svg>

  <!-- HTML Nodes Layer (Foreground) -->
  <div class="absolute top-0 left-0 w-full h-full z-10">
    @for (node of layout().nodes; track node.id) {
      <div 
        class="absolute w-[280px] bg-white border border-gray-200 rounded-lg shadow-sm p-4"
        [style.transform]="'translate(' + node.x + 'px, ' + node.y + 'px)'">
        
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs font-bold text-gray-400 uppercase">{{ node.data.type }}</span>
          <span class="text-xs text-gray-500 truncate" [title]="node.id">{{ node.id | slice:0:8 }}</span>
        </div>
        
        <p class="text-sm text-gray-800 line-clamp-3">
          {{ node.data.content }}
        </p>

      </div>
    }
  </div>

</llm-graph-canvas>
