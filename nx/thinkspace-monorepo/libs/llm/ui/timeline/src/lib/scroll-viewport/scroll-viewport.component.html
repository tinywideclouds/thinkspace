<!-- 
  ! DO NOT REMOVE OR HIDE SENTINEL DOM ELEMENTS !
  This viewport relies on native IntersectionObserver physics. The invisible sentinels at the top and bottom 
  of this wrapper MUST remain in the DOM to trigger auto-scroll halts and pagination. 
-->
<div class="relative w-full h-full flex flex-col overflow-hidden bg-gray-50">
  
  @if (isDebugMode()) {
    <div class="absolute top-2 right-2 bg-black/80 text-green-400 font-mono text-[10px] p-2 rounded z-50 pointer-events-none flex flex-col gap-1">
      <div>Top Content Visible: <span [class.text-white]="topContentVisible()">{{ topContentVisible() }}</span></div>
      <div>Active Prompt Visible: <span [class.text-white]="ceilingAnchorVisible()">{{ ceilingAnchorVisible() }}</span></div>
      <div>Ceiling Locked: <span [class.text-red-400]="ceilingLocked()">{{ ceilingLocked() }}</span></div>
    </div>
  }

  <!-- TOP SENTINEL (Pagination Trigger) -->
  <div #topSentinel class="w-full shrink-0 transition-all"
       [ngClass]="isDebugMode() ? 'h-2 bg-blue-500/50 border border-blue-600 z-10 flex items-center justify-center text-[8px] font-bold text-blue-900' : 'h-[1px] opacity-0'">
    @if (isDebugMode()) { TOP SENTINEL }
  </div>

  <div 
    #scrollContainer
    class="flex-1 overflow-y-auto w-full relative" 
    style="overflow-anchor: none;">
    
    <div class="flex flex-col gap-4 p-6 min-h-full">
      <ng-content></ng-content>
      
      <!-- BOTTOM SENTINEL (Auto-Scroll Lock Trigger) -->
      <div #bottomSentinel class="w-full shrink-0 mt-2 transition-all"
           [ngClass]="isDebugMode() ? 'h-2 bg-green-500/50 border border-green-600 z-10 flex items-center justify-center text-[8px] font-bold text-green-900' : 'h-[1px] opacity-0'">
        @if (isDebugMode()) { BOTTOM SENTINEL }
      </div>
    </div>
  </div>

  @if (!isAtBottom() && unreadIndicatorActive()) {
    <button 
      (click)="scrollToBottom()"
      class="absolute bottom-6 right-1/2 translate-x-1/2 px-4 py-2 bg-blue-600 text-white text-xs font-bold uppercase tracking-widest rounded-full shadow-lg hover:bg-blue-700 transition-all z-50 flex items-center gap-2">
      New Messages ↓
    </button>
  }
</div>
