<div class="relative w-full h-full flex flex-col overflow-hidden bg-gray-50">
  
  <!-- Top Sentinel for Pagination -->
  <div #topSentinel class="h-1 w-full shrink-0"></div>

  <!-- Main Scroll Area: Overflow anchor auto handles history prepend jumping -->
  <div 
    #scrollContainer
    class="flex-1 overflow-y-auto w-full relative" 
    style="overflow-anchor: auto;">
    
    <div class="flex flex-col gap-4 p-6 min-h-full">
      <ng-content></ng-content>
      
      <!-- Bottom Sentinel for Auto-Scroll Lock -->
      <div #bottomSentinel class="h-1 w-full shrink-0 mt-2" style="overflow-anchor: auto;"></div>
    </div>
  </div>

  <!-- Floating Unread Pill -->
  @if (!isAtBottom() && unreadIndicatorActive()) {
    <button 
      (click)="scrollToBottom()"
      class="absolute bottom-6 right-1/2 translate-x-1/2 px-4 py-2 bg-blue-600 text-white text-xs font-bold uppercase tracking-widest rounded-full shadow-lg hover:bg-blue-700 transition-all z-50 flex items-center gap-2">
      New Messages ↓
    </button>
  }
</div>
