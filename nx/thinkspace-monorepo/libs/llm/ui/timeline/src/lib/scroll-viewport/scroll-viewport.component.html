<div class="relative w-full h-full flex flex-col overflow-hidden bg-gray-50">
  
  @if (isDebugMode()) {
    <div class="absolute top-2 right-2 bg-black/80 text-green-400 font-mono text-[10px] p-2 rounded z-50 pointer-events-none flex flex-col gap-1">
      <div>Top Content Visible: <span [class.text-white]="topContentVisible()">{{ topContentVisible() }}</span></div>
      <div>Scroll State: <span class="text-white">{{ scrollState() | uppercase }}</span></div>
    </div>
  }

  <div 
    #scrollContainer
    class="flex-1 overflow-y-auto w-full relative" 
    style="overflow-anchor: auto;">
    
    <div class="flex flex-col gap-4 p-6 min-h-full">
      <!-- Internal top anchor bumper for content bounds debugging -->
      <div 
        class="w-full shrink-0 transition-all"
        [ngClass]="isDebugMode() ? 'h-[3em] bg-purple-500/20 border-2 border-dashed border-purple-500 z-10 flex items-center justify-center text-purple-700 text-[10px] font-bold mb-2' : 'h-[1px] opacity-0'">
        @if (isDebugMode()) { START OF CONTENT BOX }
      </div>

      <ng-content></ng-content>
      
      <!-- BOTTOM SENTINEL (Auto-Scroll Lock Trigger) -->
      <div 
        #bottomSentinel 
        class="w-full shrink-0 mt-2 transition-all"
        [ngClass]="isDebugMode() ? 'h-2 bg-green-500/50 border border-green-600 z-10 flex items-center justify-center text-[8px] font-bold text-green-900' : 'h-[1px] opacity-0'">
        @if (isDebugMode()) { BOTTOM SENTINEL }
      </div>
    </div>
  </div>
</div>
