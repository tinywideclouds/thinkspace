<llm-scroll-viewport (loadPreviousPage)="connection.loadHistoryPage()">
  
  @for (item of facade.workingMemoryFeed(); track item.id) {
    <div class="w-full transition-all duration-300" style="overflow-anchor: none;">
      
      @if (item.source === 'flow_card' && item.flowId) {
        <div [class.opacity-30]="facade.isItemDimmed(item)" [class.h-2]="facade.isItemCollapsed(item)" class="transition-all duration-300 overflow-hidden">
          @if (!facade.isItemCollapsed(item)) {
            <llm-chat-flow-card 
              [flow]="facade.flowStates().get(item.flowId)" 
              [summary]="item.content"
              (inspect)="facade.inspectFlow($event)">
            </llm-chat-flow-card>
          }
        </div>
      } 
      
      @else if (item.source === 'model' || item.source === 'system') {
        <llm-model-message-block 
          [source]="item.source" 
          [content]="item.content"
          [tags]="item.tags || []"
          [isDimmed]="facade.isItemDimmed(item)"
          [isCollapsed]="facade.isItemCollapsed(item)"
          [activeTag]="facade.hoveredTag() || facade.selectedTag()"
          (tagHover)="facade.setHoveredTag($event)"
          (tagClick)="facade.toggleSelectedTag($event)">
        </llm-model-message-block>
      } 
      
      @else {
        <!-- User Blocks -->
        <div 
          class="transition-all duration-300 overflow-hidden"
          [ngClass]="{
            'opacity-30 scale-[0.98]': facade.isItemDimmed(item) && !facade.isItemCollapsed(item),
            'h-2 opacity-40 py-0 mb-2 bg-blue-100 border-transparent': facade.isItemCollapsed(item)
          }"
        >
          @if (!facade.isItemCollapsed(item)) {
            <llm-user-message-block [content]="item.content"></llm-user-message-block>
          }
        </div>
      }
      
    </div>
  }
</llm-scroll-viewport>
