<div class="relative w-full h-full">

  @if (facade.isDebugMode()) {
    <button 
      (click)="facade.toggleDebugMode()"
      class="absolute top-2 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white font-bold text-[10px] px-3 py-1 rounded-full shadow-md hover:bg-red-700 transition-colors group"
      title="Visual bumpers are active to debug scroll intersection physics. Click to disable.">
      [!] SCROLL PHYSICS DEBUG ACTIVE
      <span class="hidden group-hover:inline ml-2 text-red-200">Click to disable</span>
    </button>
  }

  <llm-scroll-viewport 
    [ceilingAnchor]="activeAnchorElement()" 
    [topContentAnchor]="topAnchorElement()"
    [isDebugMode]="facade.isDebugMode()"
    (loadPreviousPage)="connection.loadHistoryPage()">
    
    <div #topAnchor class="w-full shrink-0 transition-all"
         [ngClass]="facade.isDebugMode() ? 'h-[4em] bg-purple-500/20 border-2 border-dashed border-purple-500 z-10 flex items-center justify-center text-purple-700 text-[10px] font-bold mb-4' : 'h-1 mb-2 opacity-0'">
      @if (facade.isDebugMode()) { START OF CONTENT BOX }
    </div>

    @for (item of facade.workingMemoryFeed(); track item.id) {
      <llm-block-router [chatItem]="item">
        @if (item.id === activeUserPromptId()) {
          <div #activeAnchor class="absolute bottom-0 w-full pointer-events-none transition-all" 
               [style.height]="contextBoxHeight()"
               [ngClass]="facade.isDebugMode() ? 'bg-red-500/20 border-2 border-dashed border-red-500 z-10 flex items-start justify-center pt-1 text-red-700 text-[10px] font-bold' : 'opacity-0'">
            @if (facade.isDebugMode()) { ACTIVE PROMPT ANCHOR }
          </div>
        }
      </llm-block-router>
    }
  </llm-scroll-viewport>
</div>
