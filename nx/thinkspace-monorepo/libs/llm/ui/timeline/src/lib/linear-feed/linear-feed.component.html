<div class="relative w-full h-full">

  @if (facade.isDebugMode()) {
    <button 
      (click)="facade.toggleDebugMode()"
      class="absolute top-2 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white font-bold text-[10px] px-3 py-1 rounded-full shadow-md hover:bg-red-700 transition-colors group"
      title="Visual bumpers are active to debug scroll intersection physics. Click to disable.">
      [!] SCROLL PHYSICS DEBUG ACTIVE
      <span class="hidden group-hover:inline ml-2 text-red-200">Click to disable</span>
    </button>
  }

  <llm-scroll-viewport 
    #viewport
    [prefetchAnchor]="prefetchAnchorElement()"
    [isDebugMode]="facade.isDebugMode()"
    (loadPreviousPage)="connection.loadHistoryPage()">

    @if (facade.isLoadingHistory()) {
      <llm-skeleton-block></llm-skeleton-block>
    }

    @for (item of facade.workingMemoryFeed(); track item.id) {
      <llm-block-router [chatItem]="item"></llm-block-router>
    }
  </llm-scroll-viewport>

  @if (viewport.scrollState() === 'manual') {
    <button 
      (click)="viewport.scrollToBottom('smooth')"
      class="absolute bottom-6 right-1/2 translate-x-1/2 px-4 py-2 text-xs font-bold uppercase tracking-widest rounded-full shadow-lg transition-all z-50 flex items-center justify-center gap-2 border"
      [ngClass]="hasNewMessages() ? 'bg-blue-600 text-white border-blue-600 hover:bg-blue-700' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50 hover:text-gray-900'">
      @if (hasNewMessages()) {
        New Messages ↓
      } @else {
        ↓
      }
    </button>
  }
</div>
