<div 
  class="graph-viewport w-full h-full relative overflow-hidden bg-gray-50 cursor-grab active:cursor-grabbing"
  (wheel)="onWheel($event)"
  (mousedown)="onMouseDown($event)"
  (window:mousemove)="onMouseMove($event)"
  (window:mouseup)="onMouseUp()">
  
  <div 
    class="graph-stage absolute top-0 left-0 w-full h-full origin-top-left will-change-transform"
    [style.transform]="transformString()">
    
    <!-- Render projected nodes and edges here -->
    <ng-content></ng-content>
    
  </div>

  <!-- Optional overlay controls for manual zooming/resetting -->
  <div class="absolute bottom-4 right-4 flex flex-col gap-2 z-50 bg-white rounded-lg shadow-sm border border-gray-200 p-1">
    <button 
      (click)="resetView()" 
      class="p-2 text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded transition-colors"
      title="Reset View">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>
