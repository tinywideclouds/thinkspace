syntax = "proto3";

package thinkspace.api.v1;
option go_package = "github.com/tinywideclouds/thinkspace/api/v1;api_v1";

// --- Enums ---
enum DelegationStrategy {
  DELEGATION_STRATEGY_UNSPECIFIED = 0;
  DELEGATION_STRATEGY_SKIP = 1;
  DELEGATION_STRATEGY_MANUAL = 2;
  DELEGATION_STRATEGY_REVIEW = 3;
  DELEGATION_STRATEGY_REFINE = 4;
}

enum MessageType {
  UNSPECIFIED = 0;
  PROMPT = 1;
  MODEL = 2;
  SYSTEM = 3;
}

enum FlowStatus {
  FLOW_STATUS_UNSPECIFIED = 0;
  FLOW_STATUS_RUNNING = 1;
  FLOW_STATUS_COMPLETED = 2;
  FLOW_STATUS_FAILED = 3;
}

// --- Shared Types ---
message SpaceInfo {
  string id = 1;
  string name = 2;
  bool is_configured = 3;
}

message Message {
  MessageType type = 1;
  string text = 2;
}

message CandidateProposal {
  string candidate_id = 1;
  string description = 2;
  repeated string files = 3;
  string diff_snippet = 4;
}

message CandidateResolution {
  string candidate_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message FlowExecution {
  string flow_id = 1;
  string task_id = 2;
  string task = 3;
  FlowStatus status = 4;
  string summary = 5;
  string error = 6;
  repeated AgentRecord agents = 7;
}

message AgentRecord {
  string agent_id = 1;
  bool passed = 2;
  string instruction = 3;
  string raw_payload = 4;
  string verification_trace = 5;
  string state_delta = 6;
}

message FileDelta {
  string summary = 1;
  string path = 2;
  string preview_snippet = 3;
  string file_ref = 4;
  string parent_id = 5;
}

message GraphEvent {
  string id = 1;
  string timestamp = 2;
  repeated string tags = 3;
  bool tombstoned = 4;
  // Field 5 (branch_id) removed to ensure pure, context-agnostic nodes
  map<string, string> edges = 6; 
  map<string, string> metadata = 7;

  oneof payload {
    Message message = 8;
    CandidateProposal candidate_proposal = 9;
    CandidateResolution candidate_resolution = 10;
    FlowExecution flow_execution = 11;
    FileDelta file_delta = 12; 
  }
}

message DigestMeta {
  string id = 1;
  string summary = 2;
  bool is_sticky = 3;
}

message AttentionFocus {
  repeated string primary_focus = 1;
  repeated string related_context = 2;
  repeated string dormant_lenses = 3;
}

// --- Outbound Data (Server -> Client) ---

message ChatStream {
  string node_id = 1;
  string text = 2;
}

message StreamedGraphEvent {
  GraphEvent event = 1;
  string space_id = 2;
  string chat_id = 3;
  string projection_id = 4;
}

message SyncHistory {
  repeated GraphEvent recent_events = 1;
  map<string, DigestMeta> digests = 2;
  AttentionFocus focus = 3;
  
  string next_cursor = 4;
  bool has_more = 5;
  
  string space_id = 6;
  string chat_id = 7;
  string projection_id = 8;
}

message SyncSubGraph {
  repeated GraphEvent events = 1;
  
  string space_id = 2;
  string chat_id = 3;
  string projection_id = 4;
}

message LoadHistory {
  string space_id = 1;
  string chat_id = 2;
  string cursor = 3;  
  int32 limit = 4;    
}

message LoadSubGraph {
  string space_id = 1;
  string chat_id = 2;
  string graph_id = 3;
}

message RequestStrategy {
  bool active = 1;
}

message RequestReview {
  string branch = 1;
}

message RequestTransition {
  string target_think_state = 1;
  string reasoning = 2;
}

message AvailableSpaces {
  repeated SpaceInfo spaces = 1;
}

message PreviewContext {
  string space_id = 1;
  string chat_id = 2;
  string preview_id = 3; 
  string manager_system_prompt = 4;
  repeated string sticky_digests = 5;
  repeated string recent_history = 6;
  repeated FileContextMetaData file_contexts = 7;
  AttentionFocus focus = 8;
}

message FileContextMetaData {
  string path = 1;
  string level = 2; 
  int32 token_count = 3;
}

message TelemetryData {
  string id = 1;            
  string type = 2;          
  string timestamp = 3;     
  string message = 4;       
  string summary = 5;       
  string payload_json = 6;  
}

message TelemetryEvent {
  string channel = 1;       
  TelemetryData event = 2;
}

// --- Schema Registry for UI ---
message FanOut {
  string flow_id = 1;
  string task_id = 2;
  int32 agent_count = 3;
  int32 agent_index = 4;
  string instruction = 5;
  int32 attempt = 6;
  string trace = 7;
  string candidate_id = 8;
  bool passed = 9;
}

message Manager {
  string branch = 1;
  string strategy = 2;
}

// --- Inbound Commands (Client -> Server) ---
message SubmitPrompt {
  string text = 1;
  string space_id = 2;
  string chat_id = 3;
}

message SelectStrategy {
  DelegationStrategy strategy_id = 1;
}

message ReviewDecision {
  string branch = 1;
  bool accepted = 2;
}

message ApproveContext {
  bool approved = 1;
  repeated string retained_file_paths = 2;
  repeated int32 retained_history_indices = 3;
}

message TransitionDecision {
  bool approved = 1;
}

message ForkChat {
  string space_id = 1;
  string chat_id = 2;
  string target_event_id = 3;
}

message InlineEdit {
  string space_id = 1;
  string chat_id = 2;
  string target_event_id = 3;
  string new_text = 4;
}

message SwitchBranch {
  string space_id = 1;
  string chat_id = 2;
  string target_branch = 3;
}

// --- Internal Debug / Core Logic (Optional) ---
message SystemRules {
	string persona = 1;
	string formatting_constraints = 2;
}

message Mapbook {
	map<string, string> maps = 1;
}

message TrajectoryEvent {
	string role = 1;
	string content = 2;
}

message Trajectory {
	repeated string long_term_memory = 1;
	repeated TrajectoryEvent working_memory = 2;
	TrajectoryEvent catalyst = 3;
}

message WorkbenchItem {
	string path = 1;
	string content = 2;
	int32 token_count = 3;
}

message ThinkBundle {
	string space_id = 1;
	string chat_id = 2;
	string preview_id = 3;
	SystemRules rules = 4;
	Mapbook mapbook = 5;
	Trajectory trajectory = 6;
	repeated WorkbenchItem workbench = 7;
}

// --- The Master Envelope ---
message WSEvent {
  oneof payload {
    ChatStream chat_stream = 1;
    TelemetryEvent telemetry_event = 2;
    StreamedGraphEvent streamed_graph_event = 23;

    RequestStrategy request_strategy = 8;
    RequestReview request_review = 9;
    RequestTransition request_transition = 20;

    AvailableSpaces available_spaces = 10;
    SyncHistory sync_history = 15;
    SyncSubGraph sync_sub_graph = 27;
    PreviewContext preview_context = 18; 
    
    ThinkBundle think_bundle = 16;

    SubmitPrompt submit_prompt = 11;
    SelectStrategy select_strategy = 12;
    ReviewDecision review_decision = 13;
    ApproveContext approve_context = 17;
    TransitionDecision transition_decision = 21;
    LoadHistory load_history = 22;
    LoadSubGraph load_sub_graph = 28; 

    ForkChat fork_chat = 24;
    InlineEdit inline_edit = 25;
    SwitchBranch switch_branch = 26;
  }
}