syntax = "proto3";

package thinkspace.api.v1;
option go_package = "github.com/tinywideclouds/thinkspace/api/v1;api_v1";

// --- Enums ---
enum DelegationStrategy {
  DELEGATION_STRATEGY_UNSPECIFIED = 0;
  DELEGATION_STRATEGY_SKIP = 1;
  DELEGATION_STRATEGY_MANUAL = 2;
  DELEGATION_STRATEGY_REVIEW = 3;
  DELEGATION_STRATEGY_REFINE = 4;
}

// --- Shared Types ---
message SpaceInfo {
  string id = 1;
  string name = 2;
  bool is_configured = 3;
}

// The generic core memory block, mirroring `thinkgraph.Event` exactly.
message GraphEvent {
  string id = 1;
  // Defines the semantic type of the event (e.g., "prompt", "model", "file_delta", "flow_card")
  // The frontend uses this to dynamically route to the correct UI block component.
  string type = 2;
  string timestamp = 3;
  // A human-readable summary, or the raw text for standard prompt/model events.
  string content = 4;
  // Semantic routing tags (e.g., "database", "ui")
  repeated string tags = 5;
  // UI-specific payload variables (e.g., {"path": "src/main.go", "previewSnippet": "..."})
  map<string, string> metadata = 6;
  bool tombstoned = 7;
}

message DigestMeta {
  string id = 1;
  string summary = 2;
  bool is_sticky = 3;
}

message AttentionFocusPayload {
  repeated string primary_focus = 1;
  repeated string related_context = 2;
  repeated string dormant_lenses = 3;
}

// --- Outbound Payloads (Server -> Client) ---

message ChatStreamPayload {
  string text = 1;
}

message AgentStreamPayload {
  int32 agent_id = 1;
  string text = 2;
}

// Real-time delivery of a GraphEvent over the WebSocket before it is batched into a SyncHistoryPayload.
message StreamedGraphEvent {
  GraphEvent event = 1;
}

message SyncHistoryPayload {
  repeated GraphEvent recent_events = 1;
  map<string, DigestMeta> digests = 2;
  AttentionFocusPayload focus = 3;
  
  // Pagination additions
  string next_cursor = 4;
  bool has_more = 5;
}

message LoadHistoryPayload {
  string space_id = 1;
  string chat_id = 2;
  string cursor = 3;  // The ID of the oldest event currently visible
  int32 limit = 4;    // Number of events to fetch (e.g., 50)
}

// Core System Payloads
message RequestStrategyPayload {
  bool active = 1;
}

message RequestReviewPayload {
  string branch = 1;
}

message RequestTransitionPayload {
  string target_domain = 1;
  string reasoning = 2;
}

message AvailableSpacesPayload {
  repeated SpaceInfo spaces = 1;
}

message PreviewContextPayload {
  string space_id = 1;
  string chat_id = 2;
  string preview_id = 3; 
  string manager_system_prompt = 4;
  repeated string sticky_digests = 5;
  repeated string recent_history = 6;
  repeated FileContextMetaData file_contexts = 7;
  AttentionFocusPayload focus = 8;
}

message FileContextMetaData {
  string path = 1;
  string level = 2; 
  int32 token_count = 3;
}

// --- The New Unified Telemetry Protocol ---
message TelemetryEvent {
  string id = 1;            // UUID
  string type = 2;          // e.g., "log", "flow_start", "flow_status"
  string timestamp = 3;     // RFC3339 formatted time string
  string message = 4;       // Human readable context
  string summary = 5;       // Optional overarching task summary
  string payload_json = 6;  // Arbitrary untyped contextual data (e.g., EnginePayload, ManagerPayload)
}

message TelemetryEventPayload {
  string channel = 1;       // Destination UI Tab (e.g., "manager", "agent-1")
  TelemetryEvent event = 2;
}

// --- Schema Registry for UI ---
message FanOutPayload {
  string flow_id = 1;
  string task_id = 2;
  int32 agent_count = 3;
  int32 agent_index = 4;
  string instruction = 5;
  int32 attempt = 6;
  string trace = 7;
  string candidate_id = 8;
  bool passed = 9;
}

message ManagerPayload {
  string branch = 1;
  string strategy = 2;
}

// --- Inbound Payloads (Client -> Server) ---
message SubmitPromptPayload {
  string text = 1;
  string space_id = 2;
  string chat_id = 3;
}

message SelectStrategyPayload {
  DelegationStrategy strategy_id = 1;
}

message ReviewDecisionPayload {
  string branch = 1;
  bool accepted = 2;
}

message ApproveContextPayload {
  bool approved = 1;
  repeated string retained_file_paths = 2;
  repeated int32 retained_history_indices = 3;
}

message TransitionDecisionPayload {
  bool approved = 1;
}

// --- Internal Debug / Core Logic (Optional) ---
message SystemRulesPayload {
	string persona = 1;
	string formatting_constraints = 2;
}

message MapbookPayload {
	map<string, string> maps = 1;
}

message TrajectoryEventPayload {
	string role = 1;
	string content = 2;
}

message TrajectoryPayload {
	repeated string long_term_memory = 1;
	repeated TrajectoryEventPayload working_memory = 2;
	TrajectoryEventPayload catalyst = 3;
}

message WorkbenchItemPayload {
	string path = 1;
	string content = 2;
	int32 token_count = 3;
}

message ThinkBundlePayload {
	string space_id = 1;
	string chat_id = 2;
	string preview_id = 3;
	SystemRulesPayload rules = 4;
	MapbookPayload mapbook = 5;
	TrajectoryPayload trajectory = 6;
	repeated WorkbenchItemPayload workbench = 7;
}

// --- The Master Envelope ---
// WSEvent is strictly an infrastructure routing wrapper. WebSockets transmit raw bytes;
// this master envelope provides a type-safe `oneof` multiplexer so the receiving client 
// can easily determine which specific domain payload just arrived over the wire.
message WSEvent {
  oneof payload {
    // Outbound Live Streams (Server -> Client)
    ChatStreamPayload chat_stream = 1;
    TelemetryEventPayload telemetry_event = 2; 
    AgentStreamPayload agent_stream = 6;
    StreamedGraphEvent streamed_graph_event = 23;

    // Outbound Interactive Requests (Server -> Client)
    RequestStrategyPayload request_strategy = 8;
    RequestReviewPayload request_review = 9;
    RequestTransitionPayload request_transition = 20;

    // Outbound State Syncs (Server -> Client)
    AvailableSpacesPayload available_spaces = 10;
    SyncHistoryPayload sync_history = 15;
    PreviewContextPayload preview_context = 18; 
    
    // Internal state dumps
    ThinkBundlePayload think_bundle = 16;

    // Inbound Commands (Client -> Server)
    SubmitPromptPayload submit_prompt = 11;
    SelectStrategyPayload select_strategy = 12;
    ReviewDecisionPayload review_decision = 13;
    ApproveContextPayload approve_context = 17;
    TransitionDecisionPayload transition_decision = 21;
    LoadHistoryPayload load_history = 22;
  }
}