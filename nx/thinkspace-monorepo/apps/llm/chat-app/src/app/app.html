<div class="chat-container">
  <h2>ThinkSpace CLI - Web Container MVP</h2>
  
  <!-- Linear Feed now using coreChat -->
  <llm-chat-feed [feed]="state.coreChat()" />

  <!-- Interactive Prompts depending on state -->
  @if (state.pendingStrategy()) {
    <llm-chat-strategy-prompt 
      (strategySelected)="state.selectStrategy($event)" 
    />
  } @else if (state.pendingReviewBranch(); as branch) {
    <llm-chat-review-prompt 
      [branch]="branch" 
      (reviewDecided)="state.submitReview($event)" 
    />
  } @else {
    <llm-chat-input 
      (sendPrompt)="state.submitPrompt($event)" 
    />
  }

  <!-- 🚨 TEMPORARY DEBUG: Show the hidden system logs -->
  <div style="margin-top: 2rem; padding: 1rem; background: #333; color: #0f0; border-radius: 4px;">
    <h3>System / Error Logs</h3>
    @for (log of state.systemLogs(); track log.id) {
      <div style="margin-bottom: 4px;">
        <strong [style.color]="log.level === 'ERROR' ? '#f55' : '#aaa'">[{{ log.level }}]</strong> 
        {{ log.message }}
      </div>
    }
  </div>
</div>
